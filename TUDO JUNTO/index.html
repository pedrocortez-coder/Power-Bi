<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <form action="/action_page.php" target="_blank" method="get" autocomplete="on">
        <fieldset>
            <legend>Dados do Professor:</legend>
            <label for="nome" class="umaClasse">Nome do Professor:</label>
            <input type="text" id="nome" name="nome" required class="text">
            <br>
            <label for="tel" class="umaClasse">Telefone de Contato:</label>
            <input type="tel" id="tel" name="tel" required class="text">
            <br>
			<label for="email">E-mail de Contato:</label>
            <input type="email" id="email" name="email" oninput="validaTel()" required class="text">
            <br>
            <label for="num">Quantidade de Veículos:</label>
            <input type="number" id="num" name="num" min="1" required>
			<br>
            <button id="cad" onclick="duplicar()">Cadastrar Veículos</button>
            <br>
            <div id="velmultiplo">
                <!-- Este será o local onde os campos duplicados serão inseridos -->
            </div>
            <input type="submit">
        </fieldset>
    </form>
    <div id="divajuda"></div>
    <script src="script.js"></script>
</body>
</html>
